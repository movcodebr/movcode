<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>MovCode — capa do Reels</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Capa do Reels (1080x1920). Tudo fica centralizado e dentro do recorte 3:4
   do meio (y 240-1680), que e o que a grade do perfil mostra. */
*{box-sizing:border-box;margin:0;padding:0}
:root{--noite:#111214;--laranja:#FF5A1F;--pessego:#FFB08A;--cinza:#B7BAC2}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--noite)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;color:#fff;font-family:'Figtree',sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 1100px at 50% 46%,#1b1d22 0%,#121316 55%,#0a0b0d 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.04) 2px,transparent 2px);background-size:90px 90px;background-position:-45px -15px;
  -webkit-mask-image:radial-gradient(900px 900px at 50% 50%,#000 0%,transparent 75%)}
#glow{position:absolute;width:1500px;height:1500px;left:-210px;top:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,31,.24) 0%,rgba(255,90,31,.08) 34%,rgba(255,90,31,0) 68%)}
.disp{font-family:'Bricolage Grotesque';font-weight:800;font-stretch:75%;letter-spacing:-.035em;line-height:.9}
.mono{font-family:'JetBrains Mono';font-weight:500;letter-spacing:.08em;text-transform:uppercase}

#col{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#logo{display:flex;justify-content:center;margin-bottom:70px;filter:drop-shadow(0 0 40px rgba(255,90,31,.45))}
#kicker{font-size:30px;color:var(--pessego);margin-bottom:46px}
#title{align-self:stretch;text-align:center;font-size:150px;margin-bottom:64px}
#title .ln{display:block;white-space:nowrap}
#tam{color:var(--laranja);text-shadow:0 0 70px rgba(255,90,31,.35)}
/* as letras maiores nao aumentam a altura da linha (espaco igual entre as tres) */
#tam span{display:inline-block;line-height:0}
#sub{font:600 44px 'Figtree';color:var(--cinza);margin-bottom:120px}
#marca{display:flex;justify-content:center;align-items:baseline;gap:26px}
#marca .wm{font:700 64px/1 'Bricolage Grotesque';letter-spacing:-.03em}
#marca .wm b{color:var(--laranja);font-weight:700}
#marca .at{font:600 32px 'JetBrains Mono';color:var(--cinza)}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div class="grid"></div>
  <div id="glow"></div>
  <div id="col">
    <div id="logo"></div>
    <div id="kicker" class="mono">Sites · Lojas · Sistemas · Automações</div>
    <div id="title" class="disp">
      <span class="ln">Tecnologia do</span>
      <span class="ln" id="tam">tamanhoooo</span>
      <span class="ln">do seu negócio.</span>
    </div>
    <div id="sub">Do mercadinho à indústria.</div>
    <div id="marca"><span class="wm">Mov<b>Code.</b></span><span class="at">@mov.code</span></div>
  </div>
</div>
<script>
// mesmo mascote da cena final do video (scene.html, makeDuo)
function makeDuo(w, cor) {
  const d = document.createElement('div');
  const gap = w * .03, col = (w - gap) / 2;
  d.style.cssText = `display:grid;grid-template-columns:${col}px ${col}px;gap:${gap}px;width:${w}px`;
  for (let i = 0; i < 2; i++) {
    const f = document.createElement('div');
    f.style.cssText = `display:grid;align-content:start;gap:${gap}px`;
    const h = document.createElement('b');
    h.style.cssText = `display:block;width:${col}px;height:${col}px;border-radius:50%;background:${cor};position:relative`;
    for (const side of ['left', 'right']) {
      const e = document.createElement('i');
      e.style.cssText = `position:absolute;top:38%;${side}:26%;width:15%;height:19%;border-radius:50%;background:#111214`;
      h.appendChild(e);
    }
    const b = document.createElement('b');
    b.style.cssText = `display:block;width:${col}px;height:${col * 1.55}px;border-radius:999px;background:${cor}`;
    f.append(h, b);
    d.appendChild(f);
  }
  return d;
}

window.__ready = document.fonts.ready.then(() => {
  document.getElementById('logo').appendChild(makeDuo(150, '#FF5A1F'));
  // "tamanhoooo": os "o" crescem um a um, como no video, ate a altura do "h";
  // assim nenhuma letra invade a linha de cima e o espaco entre as linhas fica igual
  const tam = document.getElementById('tam');
  const cv = document.createElement('canvas').getContext('2d');
  cv.font = '800 condensed 100px "Bricolage Grotesque"';
  const maxO = cv.measureText('h').actualBoundingBoxAscent / cv.measureText('o').actualBoundingBoxAscent;
  const chars = [...tam.textContent];
  const o0 = chars.indexOf('o'), nO = chars.length - o0;
  tam.innerHTML = chars.map((c, i) => {
    const k = i < o0 ? 1 : 1 + (maxO - 1) * (i - o0) / (nO - 1);
    return `<span style="font-size:${k.toFixed(3)}em">${c}</span>`;
  }).join('');
  // o titulo inteiro cabe na largura com 70px de margem
  const title = document.getElementById('title');
  const maxW = 1080 - 140;
  const widest = Math.max(...[...title.querySelectorAll('.ln')].map((l) => {
    l.style.display = 'inline-block';
    const w = l.getBoundingClientRect().width;
    l.style.display = '';
    return w;
  }));
  if (widest > maxW) title.style.fontSize = (150 * maxW / widest).toFixed(1) + 'px';
});
</script>
</body>
</html>
